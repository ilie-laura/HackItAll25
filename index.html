    const d = await res.json();
    alert(" GPS blocat");
    showPosition({ coords:{ latitude:d.latitude, longitude:d.longitude }});
}

function showPosition(pos) {
    userCoords = [pos.coords.latitude, pos.coords.longitude];
    map.setView(userCoords, 15);
    L.marker(userCoords).addTo(map).bindPopup("Tu ești aici").openPopup();

}


async function loadNearby() {

        [out:json];
        (
            node["shop"](around:${MAX_DISTANCE},${userCoords[0]},${userCoords[1]});

        body: query
    });

        .map(el => ({
            name: el.tags.name || "Fără nume",

            street: el.tags["addr:street"] || "",
            lat: el.lat,
            lon: el.lon,
            distance: map.distance(userCoords, [el.lat, el.lon])
        }))
        .filter(s => s.distance <= MAX_DISTANCE);

             Cautare pe Web</span>

<script>-
let map, shops = [], userCoords = null;
const MAX_DISTANCE = 5000;

const semanticMap = {
    pharmacy:["farmacie","pastile","antibiotic","medicamente","aspirină"],
    bakery:["pâine","paine","covrigi","cozonac","patiserie","brutărie"],
    clothes:["haine","tricou","fustă","second hand","pantofi","moda","rochie"],
    supermarket:["alimentar","supermarket","magazin","kaufland","carrefour","mega"],
    marketplace:["piață","piata","bio","local","legume","fructe","târg"]
};

function detectCategory(text){
    text=text.toLowerCase();
    for(const cat in semanticMap){
        if(semanticMap[cat].some(w=>text.includes(w))) return cat;
    }
    return null;
}


map=L.map('map').setView([45,25],7);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19}).addTo(map);
let markersLayer=L.layerGroup().addTo(map);

function getLocation(){
    if(navigator.geolocation){
        navigator.geolocation.getCurrentPosition(showPosition,fallbackIP,{timeout:5000});
    } else fallbackIP();
}

async function fallbackIP(){
    const res=await fetch("https://ipapi.co/json/");
    const d=await res.json();
    alert("⚠ GPS blocat — folosesc locația IP.");
    showPosition({coords:{latitude:d.latitude,longitude:d.longitude}});
}

function showPosition(pos){
    userCoords=[pos.coords.latitude,pos.coords.longitude];
    map.setView(userCoords,15);
    L.marker(userCoords).addTo(map).bindPopup("📍 Tu ești aici").openPopup();
    loadNearby();
}

async function loadNearby(){
    const query=`
        [out:json];
        (
            node["shop"](around:${MAX_DISTANCE},${userCoords[0]},${userCoords[1]});
            node["amenity"="marketplace"](around:${MAX_DISTANCE},${userCoords[0]},${userCoords[1]});
        ); out center;`;

    const req=await fetch("https://overpass-api.de/api/interpreter",{method:"POST",body:query});
    const data=await req.json();

    shops=data.elements.map(el=>({
        name:el.tags.name||"Fără nume",
        type:el.tags.shop||el.tags.amenity||"loc",
        lat:el.lat, lon:el.lon,
        distance:map.distance(userCoords,[el.lat,el.lon])
    })).filter(s=>s.distance<=MAX_DISTANCE);

    renderMarkers();
    renderResults();
}


function renderMarkers(){
    markersLayer.clearLayers();
    const bounds=[userCoords,...shops.map(s=>[s.lat,s.lon])];

    shops.forEach(s=>{
        L.marker([s.lat,s.lon]).addTo(markersLayer)
        .bindPopup(`<b>${s.name}</b><br>${s.type}<br>📏 ${Math.round(s.distance)}m`);
    });

    map.fitBounds(bounds,{padding:[50,50],maxZoom:16});
}

document.getElementById("user-intent").addEventListener("input", renderResults);

function renderResults(){
    const list=document.getElementById("list");
    const query=document.getElementById("user-intent").value.trim().toLowerCase();

    if(!query) return list.innerHTML="✏️ Scrie ce cauți…";

    const category=detectCategory(query);
    let results=shops;

    if(category) results=results.filter(s=>s.type.includes(category));

    if(!results.length)
        return list.innerHTML=`❌ Nimic găsit pentru "<b>${query}</b>" în 5km.`;

    results.sort((a,b)=>a.distance-b.distance);

    list.innerHTML=results.map(s=>`
        <div class="shop">
            <b>${s.name}</b><br>
            🏷 ${s.type}<br>
            📏 ${Math.round(s.distance)}m<br>
            <span class="search-link" onclick="openWeb('${s.name} ${s.type}')">🔍 căutare online</span>
        </div>
    `).join("");
}

function openWeb(q){

}

getLocation();
