body {

/* Sidebar */
.sidebar {
  width: 150px;
  background-color: #ffffff;
  position: fixed;
  height: 100%;
  overflow: hidden;
  border-right: 2px solid #ccc;
}
.sidebar a {
  display: block;
  color: black;
  padding: 16px;
  text-decoration: none;
}
.sidebar a.active { background-color: #04AA6D; color: white; }
.sidebar a:hover:not(.active) { background-color: #e6e6e6; }

.sidebar img{
    width: 70px;
    margin: 20px auto;
    display: block;
}

/* Layout */
.container {
  margin-left: 150px;
  display: flex;
  height: 100vh;
}

/* Rezultate în locul hărții */
#results {
    width: 50%;
    padding: 15px;
    overflow-y: auto;
    background: #fff;
    border-right: 2px solid #ccc;
}

/* Panel chat */
#panel {
    width: 50%;
    display: flex;
    flex-direction: column;
    background: white;
}

#chat {
    padding: 15px;
    flex-grow: 1;
    overflow-y: auto;
}

/* Mesaje tip WhatsApp */
.bubble {
    max-width: 80%;
    padding: 10px;
    margin: 6px 0;
    border-radius: 18px;
    font-size: 15px;
}
.user { background: #d2ffe0; align-self: flex-end; border-radius: 18px 18px 0 18px; }
.bot  { background: #ececec; align-self: flex-start; border-radius: 18px 18px 18px 0; }

/* Input */
#chat-input-area {
    display: flex;
    padding: 10px;
    border-top: 2px solid #ccc;
}
#chat-input {
    flex: 1;
    padding: 10px;
    font-size: 16px;
}
#send-btn {
    background:#04AA6D;
    color:white;
    border:none;
    padding:10px 14px;
    border-radius:6px;
    cursor:pointer;
}

/* Card rezultate */
.card {
    border: 1px solid #ccc;
    padding: 12px;
    margin-bottom: 8px;
    border-radius: 8px;
    background:#fafafa;
}
.badge.local{ background:#04AA6D;color:white;padding:3px 6px;font-size:11px;border-radius:4px;}
.badge.chain{ background:#d9534f;color:white;padding:3px 6px;font-size:11px;border-radius:4px;}
.link-container { margin-top:8px; }
.muted { color:#555;font-size:13px; }
</style>

<script>
// ===== UTIL =====
function norm(t){ return t.toLowerCase().normalize("NFD").replace(/\p{Diacritic}/gu,""); }
function escapeHTML(t){ return t.replace(/[<>]/g,""); }

const chains=["lidl","kaufland","carrefour","mega","dm","pepco","zara","hm","penny"];
function isChain(name){ return chains.some(x=>norm(name).includes(x)); }

const keywords={
  farmacie:["farmacie","pastile","medicamente"],
  paine:["paine","covrigi","patiserie","brutarie"],
  haine:["haine","second hand","tricou","pantofi","blugi"],
  cafea:["cafea","cafenea"],
  supermarket:["supermarket","magazin","market"]
};

function detectIntent(q){
  q=norm(q);
  for(let key in keywords)
    if(keywords[key].some(w=>q.includes(w))) return key;
  return null;
}

function extractExclude(q){
  q=norm(q);
  const out=[];
  const r=/((nu vreau|fara|fără) ([a-z0-9 ]+))/g;
  let m; 
  while(m=r.exec(q)) out.push(m[3].trim());
  return out;
}

// ===== DATA FETCH =====
let shops=[], userPos=null;

navigator.geolocation.getCurrentPosition(load,fallback);
async function fallback(){
  const d=await (await fetch("https://ipapi.co/json/")).json();
  load({coords:{latitude:d.latitude,longitude:d.longitude}});
}

async function load(pos){
 userPos=[pos.coords.latitude,pos.coords.longitude];

 const query=`
[out:json][timeout:25];
(
 node["shop"](around:5000,${userPos[0]},${userPos[1]});
 way["shop"](around:5000,${userPos[0]},${userPos[1]});
);
out center;
`;

 const res=await fetch("https://overpass-api.de/api/interpreter",{method:"POST",body:query});
 const data=await res.json();

 shops=data.elements.map(e=>{
   const lat=e.lat||e.center?.lat;
   const lon=e.lon||e.center?.lon;
   return {
     name:e.tags.name||"Fara nume",
     type:e.tags.shop||"",
     lat,lon,
     chain:isChain(e.tags.name||""),
     dist:(lat&&lon)?Math.random()*5000:999999  // mock distance (server limit)
   }
 });
}

// ===== UI CHAT =====
const chat=document.getElementById("chat");
const results=document.getElementById("results");

function bubble(msg,role){
 let div=document.createElement("div");
 div.className="bubble "+role;
 div.innerHTML=msg;
 chat.append(div);
 chat.scrollTop=chat.scrollHeight;
}

document.getElementById("send-btn").onclick=run;
document.getElementById("chat-input").addEventListener("keydown",e=>{if(e.key==="Enter")run();});

function run(){
 let q=document.getElementById("chat-input").value.trim();
 if(!q) return;
 document.getElementById("chat-input").value="";
 bubble(escapeHTML(q),"user");
 search(q);
}

// ===== SEARCH =====
function search(q){
 if(!shops.length) return bubble("Se încarcă locațiile... încearcă din nou.","bot");

 const intent=detectIntent(q);
 const exclude=extractExclude(q);
 const qn=norm(q);

 if(!intent) return bubble("Nu înțeleg. Încearcă: farmacie, paine, haine.","bot");

 let filtered=shops.filter(s=>norm(s.type).includes(intent)||norm(s.name).includes(intent)||norm(s.name).includes(qn));

 if(exclude.length){
    filtered=filtered.filter(s=>exclude.every(ex=> !norm(s.name).includes(ex) && !norm(s.type).includes(ex)));
 }

 if(!filtered.length) return bubble("Nimic potrivit găsit.","bot");

 filtered.forEach(s=>{ s.score=(s.chain?-0.3:0.4)+(1/(s.dist+1)); });
 filtered.sort((a,b)=>b.score-a.score);
 filtered=filtered.slice(0,10);

 results.innerHTML="";

 filtered.forEach(s=>{
    let card=document.createElement("div");
    card.className="card";
    card.innerHTML=`
      <b>${escapeHTML(s.name)}</b>
      ${s.chain?'<span class="badge chain">Lanț</span>':'<span class="badge local">Local</span>'}
      <div class="muted">${escapeHTML(s.type)}</div>
      <div class="link-container">
        <a target="_blank" href="https://www.google.com/maps?q=${s.lat},${s.lon}">Deschide pe hartă</a>
      </div>
    `;
    results.append(card);
 });

 bubble(`Am găsit ${filtered.length} opțiuni bune.`, "bot");
}
</script>
