<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8" />
<title>Local AI Finder</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />

<style>
body{
    font-family: Arial, sans-serif;
    background-color: rgb(225, 237, 229);
    margin: 0;
}

.sidebar {
  width: 150px;
  background-color: #ffffff;
  position: fixed;
  height: 100%;
  overflow: hidden;
  border-right: 2px solid #ccc;
}

.sidebar a {
  display: block;
  color: black;
  padding: 16px;
  text-decoration: none;
}

.sidebar a.active { background-color: #04AA6D; color: white; }
.sidebar a:hover:not(.active) { background-color: #e6e6e6; }

.sidebar img{
    width: 70px;
    margin: 20px auto;
    display: block;
}

.container {
  margin-left: 150px;
  display: flex;
  height: 100vh;
}

#map { width: 55%; height: 100vh; }

#panel {
    width: 45%;
    display: flex;
    flex-direction: column;
    background: white;
    border-left: 2px solid #adadad;
}

#chat {
    padding: 15px;
    overflow-y: auto;
    flex-grow: 1;
    display: flex;
    flex-direction: column;
}

.bubble {
    max-width: 80%;
    padding: 10px;
    margin: 8px 0;
    border-radius: 14px;
    font-size: 15px;
}

.user { background: #c4f7c5; align-self: flex-end; }
.bot  { background: #f0f0f0; align-self: flex-start; }

#chat-input-area {
    display: flex;
    padding: 10px;
    border-top: 2px solid #ccc;
}

#chat-input {
    flex: 1;
    padding: 10px;
    font-size: 16px;
}

#send-btn {
    background: #04AA6D;
    color: white;
    padding: 10px 14px;
    border: none;
    cursor: pointer;
    border-radius: 6px;
}
</style>
</head>

<body>

<div class="sidebar">
<img src="assets/cog.png" alt="Logo">
<a class="active">Home</a>
<a>Harta</a>
<a>Contact</a>
<a>About</a>
</div>

<div class="container">
    <div id="map"></div>

    <div id="panel">
        <div id="chat">
            <div class="bubble bot">
                👋 Salut! Spune ce cauti: <br><br>
                👉 "am nevoie de o farmacie" <br>
                👉 "caut haine second hand" <br>
                👉 "unde gasesc paine?"
            </div>
        </div>

        <div id="chat-input-area">
            <input id="chat-input" placeholder="Scrie...">
            <button id="send-btn">Trimite</button>
        </div>
    </div>
</div>


<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
function normalizeText(str){
    return str.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
}

const semanticMap = {
 pharmacy:["farmacie","pastile","medicamente"],
 bakery:["paine","covrigi","cozonac","patiserie"],
 clothes:["haine","tricou","second hand","pantofi","rochie"],
 supermarket:["magazin","supermarket","market","alimentar"],
 marketplace:["piata","targ","legume","fructe"]
};

const categoryMap = {
 pharmacy:["pharmacy"],
 bakery:["bakery"],
 clothes:["clothes","second_hand","boutique","shoes"],
 supermarket:["supermarket","convenience","grocery"],
 marketplace:["marketplace"]
};

function detectCategory(text){
 text = normalizeText(text);
 for(let c in semanticMap){
     if(semanticMap[c].some(w=>text.includes(w))) return c;
 }
 return null;
}

let map = L.map('map').setView([45,25],7);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png").addTo(map);

let shops=[], userCoords=null, markers=L.layerGroup().addTo(map), MAX_DISTANCE=5000;

navigator.geolocation.getCurrentPosition(load,fallback,{timeout:5000});

async function fallback(){
 const d = await (await fetch("https://ipapi.co/json/")).json();
 load({coords:{latitude:d.latitude,longitude:d.longitude}});
}

async function load(pos){
 userCoords=[pos.coords.latitude,pos.coords.longitude];
 L.marker(userCoords).addTo(map).bindPopup("Locatia ta");
 map.setView(userCoords,15);

 const query=`[out:json];
 (
  node["shop"](around:${MAX_DISTANCE},${userCoords[0]},${userCoords[1]});
  node["amenity"="pharmacy"](around:${MAX_DISTANCE},${userCoords[0]},${userCoords[1]});
  node["amenity"="marketplace"](around:${MAX_DISTANCE},${userCoords[0]},${userCoords[1]});
 );
 out center;`;

 const res=await fetch("https://overpass-api.de/api/interpreter",{method:"POST",body:query});
 const data=await res.json();

 shops=data.elements.map(e=>({
   name:e.tags.name || "Fara nume",
   type:e.tags.shop || e.tags.amenity || "",
   lat:e.lat,
   lon:e.lon,
   distance:map.distance(userCoords,[e.lat,e.lon])
 }));

 renderMap();
}

function renderMap(){
 markers.clearLayers();
 shops.forEach(s=>L.marker([s.lat,s.lon]).addTo(markers));
}

function sendMsg(){
 const text=document.getElementById("chat-input").value.trim();
 if(!text) return;
 document.getElementById("chat-input").value="";
 addBubble(text,"user");
 respond(text);
}

document.getElementById("send-btn").onclick=sendMsg;

const chat=document.getElementById("chat");

function addBubble(text,role){
 const b=document.createElement("div");
 b.className="bubble "+role;
 b.innerHTML=text;
 chat.append(b);
 chat.scrollTop=chat.scrollHeight;
}

function respond(text){
 const category=detectCategory(text);

 if(!category){
     addBubble("Nu inteleg... incearca: farmacie, haine, paine.","bot");
     return;
 }

 const matches=shops.filter(s=>categoryMap[category].some(tag=>normalizeText(s.type).includes(tag)));

 if(!matches.length){
     addBubble("Nu am gasit nimic in 5 km.","bot");
     return;
 }

 addBubble(`Am gasit ${matches.length} locatii pentru ${category}:`,`bot`);

 matches.sort((a,b)=>a.distance-b.distance).forEach(s=>{
     addBubble(`
         📍 <b>${s.name}</b><br>
         ${Math.round(s.distance)}m<br>
         <a href="https://www.google.com/maps/dir/?api=1&destination=${s.lat},${s.lon}" target="_blank">
         Deschide in Maps
         </a>
     `,"bot");
 });
}
</script>

</body>
</html>
