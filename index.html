<style>
body {
    font-family: Arial, sans-serif;
    background: #e5f2e6;
    margin: 0;
}

/* Sidebar */
.sidebar {
  width: 150px;
  background-color: #ffffff;
  position: fixed;
  height: 100%;
  border-right: 2px solid #ccc;
}
.sidebar a {
  display: block;
  color: black;
  padding: 16px;
  text-decoration: none;
}
.sidebar a.active { background-color: #04AA6D; color: white; }
.sidebar a:hover:not(.active) { background-color: #e6e6e6; }
.sidebar img{
    width: 70px;
    margin: 20px auto;
    display: block;
}

/* Layout */
.container {
  margin-left: 150px;
  display: flex;
  height: 100vh;
}

#results {
    width: 50%;
    padding: 15px;
    overflow-y: auto;
    background: #fff;
    border-right: 2px solid #ccc;
}

#panel {
    width: 50%;
    display: flex;
    flex-direction: column;
    background: white;
}

/* Chat UI */
#chat {
    padding: 15px;
    flex-grow: 1;
    overflow-y: auto;
}

.bubble {
    max-width: 80%;
    padding: 10px;
    margin: 6px 0;
    border-radius: 18px;
    font-size: 15px;
}
.user { background: #d2ffe0; align-self: flex-end; border-radius: 18px 18px 0 18px; }
.bot  { background: #ececec; align-self: flex-start; border-radius: 18px 18px 18px 0; }

/* Input */
#chat-input-area {
    display: flex;
    padding: 10px;
    border-top: 2px solid #ccc;
}
#chat-input {
    flex: 1;
    padding: 10px;
    font-size: 16px;
}
#send-btn {
    background:#04AA6D;
    color:white;
    border:none;
    padding:10px 14px;
    border-radius:6px;
    cursor:pointer;
}

/* Card rezultate */
.card {
    border: 1px solid #ccc;
    padding: 12px;
    margin-bottom: 8px;
    border-radius: 8px;
    background:#fafafa;
}
.badge.local{ background:#04AA6D;color:white;padding:3px 6px;font-size:11px;border-radius:4px;}
.badge.chain{ background:#d9534f;color:white;padding:3px 6px;font-size:11px;border-radius:4px;}
.link-container { margin-top:8px; }
.muted { color:#555;font-size:13px; }
</style>

<script>
const CHAT_URL = "http://localhost:3002/api/find-product";

// UI functions
const chat = document.getElementById("chat");
const results = document.getElementById("results");

function bubble(text, role){
    const div = document.createElement("div");
    div.className = "bubble " + role;
    div.innerHTML = text;
    chat.append(div);
    chat.scrollTop = chat.scrollHeight;
}

// Send message
document.getElementById("send-btn").onclick = send;
document.getElementById("chat-input").addEventListener("keydown", e=>{
    if(e.key==="Enter") send();
});

async function send(){
    const input = document.getElementById("chat-input");
    const text = input.value.trim();
    if(!text) return;

    input.value="";
    bubble(text,"user");

    bubble(" Caut pentru tine...","bot");

    try {
        const res = await fetch(CHAT_URL,{
            method:"POST",
            headers:{ "Content-Type":"application/json" },
            body: JSON.stringify({ query:text })
        });

        const data = await res.json();
        showResults(data);
        
    } catch(err){
        bubble(" Serverul AI nu răspunde.","bot");
    }
}

function showResults(data){
    results.innerHTML="";

    if(!data.results.length){
        bubble("Nu am găsit ceva relevant...","bot");
        return;
    }

    bubble(`Am găsit ${data.results.length} opțiuni`, "bot");

    data.results.forEach(item=>{
        let card = document.createElement("div");
        card.className="card";
        card.innerHTML = `
            <b>${item.name}</b> 
            ${item.type === "local" ? 
                '<span class="badge local">Local</span>' : 
                item.type === "chain" ? 
                '<span class="badge chain">Lanț</span>' : ''}
            <div class="muted">${item.reason}</div>
            <div class="link-container"><a href="${item.url}" target="_blank">🔗 Vizitează site-ul</a></div>
        `;
        results.append(card);
    });
}
</script>
