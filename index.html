<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8" />
<title>Local AI Finder</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />

<style>
body {
    font-family: Arial, sans-serif;
    background-color: rgb(225, 237, 229);
    margin: 0;
}

.sidebar {
  width: 150px;
  background-color: #ffffff;
  position: fixed;
  height: 100%;
  overflow: hidden;
  border-right: 2px solid #ccc;
}

.sidebar a {
  display: block;
  color: black;
  padding: 16px;
  text-decoration: none;
}

.sidebar a.active { background-color: #04AA6D; color: white; }
.sidebar a:hover:not(.active) { background-color: #e6e6e6; }

.sidebar img{
    width: 70px;
    margin: 20px auto;
    display: block;
}

.container {
  margin-left: 150px;
  display: flex;
  height: 100vh;
}

#map { width: 55%; height: 100vh; }

#panel {
    width: 45%;
    display: flex;
    flex-direction: column;
    background: white;
    border-left: 2px solid #adadad;
}

/* results area (lista magazinelor) */
#results {
    padding: 12px;
    border-bottom: 1px solid #eee;
    max-height: 36%;
    overflow-y: auto;
    background: #fafafa;
}

/* chat area (conservăm mesajul initial aici) */
#chat {
    padding: 15px;
    overflow-y: auto;
    flex-grow: 1;
    display: flex;
    flex-direction: column;
}

/* messages */
.bubble {
    max-width: 80%;
    padding: 10px;
    margin: 8px 0;
    border-radius: 14px;
    font-size: 15px;
}

.user { background: #c4f7c5; align-self: flex-end; }
.bot  { background: #f0f0f0; align-self: flex-start; }

#chat-input-area {
    display: flex;
    padding: 10px;
    border-top: 2px solid #ccc;
}

#chat-input {
    flex: 1;
    padding: 10px;
    font-size: 16px;
}

#send-btn {
    background: #04AA6D;
    color: white;
    padding: 10px 14px;
    border: none;
    cursor: pointer;
    border-radius: 6px;
}

.card {
    border: 1px solid #ccc;
    border-radius: 6px;
    padding: 10px;
    margin-bottom: 8px;
    background: #fff;
}

.badge.local {
    background: #04AA6D;
    color: white;
    padding: 2px 6px;
    font-size: 12px;
    border-radius: 4px;
    margin-left: 5px;
}

.badge.chain {
    background: #d9534f;
    color: white;
    padding: 2px 6px;
    font-size: 12px;
    border-radius: 4px;
    margin-left: 5px;
}

.muted { color: #666; font-size: 13px; margin-top:6px;}
</style>
</head>

<body>

<div class="sidebar">
<img src="assets/cog.png" alt="Logo">
<a class="active">Home</a>
<a>Harta</a>
<a>Contact</a>
<a>About</a>
</div>

<div class="container">
    <div id="map"></div>

    <div id="panel">
        <!-- Lista de rezultate (nu suprascrie chat-ul) -->
        <div id="results"></div>

        <!-- Chat (mesaj initial ramane) -->
        <div id="chat">
            <div class="bubble bot">
                👋 Salut! Spune ce cauți: <br><br>
                👉 "am nevoie de o farmacie" <br>
                👉 "caut haine second hand" <br>
                👉 "unde gasesc paine?" <br><br>
                Scrie un produs (ex: "blugi negrii") și apasă Trimite.
            </div>
        </div>

        <div id="chat-input-area">
            <input id="chat-input" placeholder="Scrie...">
            <button id="send-btn">Trimite</button>
        </div>
    </div>
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="app.js"></script>

</body>
</html>
