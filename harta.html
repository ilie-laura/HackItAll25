<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script>
let map = L.map("map").setView([45,25], 7);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png").addTo(map);

let markers = L.layerGroup().addTo(map);
let circle = null;

navigator.geolocation.getCurrentPosition(load, fallback, { enableHighAccuracy:true });

async function fallback(){
    const d = await fetch("https://ipapi.co/json/").then(r=>r.json());
    load({coords:{latitude:d.latitude,longitude:d.longitude}});
}

async function load(pos){
    const lat = pos.coords.latitude;
    const lon = pos.coords.longitude;

    L.marker([lat,lon]).addTo(map).bindPopup("📍 Esti aici");

    // cerc vizibil 5KM
    if(circle) map.removeLayer(circle);
    
    circle = L.circle([lat,lon], {
        radius: 5000,
        color: "#0077ff",
        fillColor: "rgba(0,119,255,0.15)",
        fillOpacity: 0.3,
        weight: 2
    }).addTo(map);

    map.setView([lat,lon], 14);

    // preia shops din OSM folosind Overpass API
    const query = `
[out:json][timeout:30];
(
 node["shop"](around:5000,${lat},${lon});
 way["shop"](around:5000,${lat},${lon});
);
out center;
`;

    const res = await fetch("https://overpass-api.de/api/interpreter", {
        method:"POST",
        headers:{ "Content-Type":"application/x-www-form-urlencoded" },
        body:"data=" + encodeURIComponent(query)
    });

    const data = await res.json();

    markers.clearLayers();

    data.elements.forEach(e => {
        const pLat = e.lat || e.center?.lat;
        const pLon = e.lon || e.center?.lon;
        const name = e.tags.name || "Magazin fara nume";

        // detectare website
        const website =
            e.tags.website ||
            e.tags.url ||
            e.tags["contact:website"] ||
            e.tags["contact:url"] ||
            e.tags.facebook ||
            e.tags.instagram ||
            null;

        let online;

        if(website){
            online = `
                <a href="${website}" target="_blank" 
                style="color:#0077cc;font-weight:bold;">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-basket2-fill" viewBox="0 0 16 16">
  <path d="M5.929 1.757a.5.5 0 1 0-.858-.514L2.217 6H.5a.5.5 0 0 0-.5.5v1a.5.5 0 0 0 .5.5h.623l1.844 6.456A.75.75 0 0 0 3.69 15h8.622a.75.75 0 0 0 .722-.544L14.877 8h.623a.5.5 0 0 0 .5-.5v-1a.5.5 0 0 0-.5-.5h-1.717L10.93 1.243a.5.5 0 1 0-.858.514L12.617 6H3.383zM4 10a1 1 0 0 1 2 0v2a1 1 0 1 1-2 0zm3 0a1 1 0 0 1 2 0v2a1 1 0 1 1-2 0zm4-1a1 1 0 0 1 1 1v2a1 1 0 1 1-2 0v-2a1 1 0 0 1 1-1"/>
</svg> Vezi site / magazin online
                </a>
            `;
        } else {
            online = `<span style="color:#777;"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-exclamation-triangle-fill" viewBox="0 0 16 16">
  <path d="M8.982 1.566a1.13 1.13 0 0 0-1.96 0L.165 13.233c-.457.778.091 1.767.98 1.767h13.713c.889 0 1.438-.99.98-1.767zM8 5c.535 0 .954.462.9.995l-.35 3.507a.552.552 0 0 1-1.1 0L7.1 5.995A.905.905 0 0 1 8 5m.002 6a1 1 0 1 1 0 2 1 1 0 0 1 0-2"/>
</svg> Niciun site găsit — doar fizic.</span>`;
        }

        const popup = `
            <b style="font-size:15px;">${name}</b><br><br>
            ${online}<br><br>
            <a href="https://www.google.com/maps?q=${pLat},${pLon}" 
               target="_blank" style="color:#04AA6D;font-weight:bold;">
               <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-clock-fill" viewBox="0 0 16 16">
  <path d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0M8 3.5a.5.5 0 0 0-1 0V9a.5.5 0 0 0 .252.434l3.5 2a.5.5 0 0 0 .496-.868L8 8.71z"/>
</svg> Navighează
            </a>
        `;

        L.marker([pLat,pLon]).addTo(markers).bindPopup(popup);
    });

}
</script>
